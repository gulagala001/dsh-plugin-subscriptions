name: OMD GitHub artifact release

on:
  push:
    tags: ['v*-omd.*']

permissions:
  contents: read

concurrency:
  group: omd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'gulagala001/dsh-plugin-subscriptions'
    uses: ./.github/workflows/omd-ci.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: omd-package
          path: .release
      - name: Verify source, tag and archive checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            const metadata = JSON.parse(fs.readFileSync(`.release/${pkg.name}-${pkg.version}.metadata.json`));
            assert.equal(process.env.TAG, `v${pkg.version}`);
            assert.equal(metadata.sourceCommit, process.env.GITHUB_SHA);
            assert.equal(metadata.distributionRepository, process.env.GITHUB_REPOSITORY);
          '
          (cd .release && sha256sum --check SHA256SUMS)
      - name: Create immutable GitHub artifact release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" .release/* --verify-tag --prerelease --title "$TAG (OMD adaptation)" --notes-file docs/omd-release.md
